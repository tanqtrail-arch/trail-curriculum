    // ─── Utility ───

    const MONTH_NAMES = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];

    // ─── LessonCard ───

          onMouseLeave={(e) => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "none"; }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>

            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", justifyContent: "flex-end" }}>
              {lesson.tags.map((tag) => (
                <span key={tag} style={{ fontSize: 11, padding: "2px 10px", borderRadius: 99, background: course.accent, color: course.color, fontWeight: 600 }}>{tag}</span>

    // ─── LessonModal ───

    // ─── Calendar ───
    function Calendar({ year, month, lessons, course, onLessonClick, onMonthChange }) {
      const days = getDaysInMonth(year, month);
      const firstDay = getFirstDayOfWeek(year, month);
      const cells = [];
      for (let i = 0; i < firstDay; i++) cells.push(null);
      for (let d = 1; d <= days; d++) cells.push(d);

      const lessonsByDate = {};
      lessons.forEach((l) => { lessonsByDate[l.date] = l; });

      const today = new Date();
      const isToday = (d) => today.getFullYear() === year && today.getMonth() === month && today.getDate() === d;

      return (
        <div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20 }}>
            <button onClick={() => onMonthChange(-1)} style={{ background: "none", border: "1px solid #DEE2E6", borderRadius: 10, padding: "8px 14px", cursor: "pointer", fontSize: 14, color: "#495057" }}>←</button>
            <h3 style={{ fontSize: 18, fontWeight: 700, color: "#1A1A2E" }}>{year}年 {MONTH_NAMES[month]}</h3>
            <button onClick={() => onMonthChange(1)} style={{ background: "none", border: "1px solid #DEE2E6", borderRadius: 10, padding: "8px 14px", cursor: "pointer", fontSize: 14, color: "#495057" }}>→</button>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
            {WEEKDAYS.map((w, i) => (
              <div key={w} style={{ textAlign: "center", fontSize: 12, fontWeight: 700, padding: "8px 0", color: i === 0 ? "#FF6B6B" : i === 6 ? "#339AF0" : "#868E96" }}>{w}</div>
            ))}
            {cells.map((d, i) => {
              const dateStr = d ? formatDate(year, month, d) : null;
              const lesson = dateStr ? lessonsByDate[dateStr] : null;
              return (
                <div key={i} onClick={() => lesson && onLessonClick(lesson)}
                  style={{ aspectRatio: "1", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", borderRadius: 12, background: lesson ? course.accent : isToday(d) ? "#F1F3F5" : "transparent", cursor: lesson ? "pointer" : "default", border: lesson ? `2px solid ${course.color}40` : isToday(d) ? "2px solid #DEE2E6" : "2px solid transparent", transition: "all 0.15s", minHeight: 44 }}
                  onMouseEnter={(e) => { if (lesson) e.currentTarget.style.transform = "scale(1.08)"; }}
                  onMouseLeave={(e) => { if (lesson) e.currentTarget.style.transform = "scale(1)"; }}>
                  {d && (<>
                    <span style={{ fontSize: 13, fontWeight: lesson ? 800 : 500, color: lesson ? course.color : isToday(d) ? "#1A1A2E" : "#868E96", fontFamily: "'DM Mono', monospace" }}>{d}</span>
                    {lesson && (<div style={{ width: 5, height: 5, borderRadius: "50%", background: course.color, marginTop: 3 }} />)}
                  </>)}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─── Main App ───

      const [calMonth, setCalMonth] = useState(0);
      const [mounted, setMounted] = useState(false);
      const [openMonths, setOpenMonths] = useState({});

      useEffect(() => setMounted(true), []);

      const course = COURSES.find((c) => c.id === activeCourse);
      const lessons = LESSONS_DATA[activeCourse] || [];

      const lessonsByMonth = {};
      lessons.forEach((l) => {
        const key = l.date.slice(0, 7);
        if (!lessonsByMonth[key]) lessonsByMonth[key] = [];
        lessonsByMonth[key].push(l);
      });
      const monthKeys = Object.keys(lessonsByMonth).sort();

      const toggleMonth = (key) => {
        setOpenMonths((prev) => ({ ...prev, [key]: !prev[key] }));
      };

      useEffect(() => { setOpenMonths({}); }, [activeCourse]);

      const handleMonthChange = (dir) => {
        let newMonth = calMonth + dir;
        let newYear = calYear;
        if (newMonth > 11) { newMonth = 0; newYear++; }
        if (newMonth < 0) { newMonth = 11; newYear--; }
        setCalMonth(newMonth);
        setCalYear(newYear);
      };

      return (
        <div style={{ minHeight: "100vh", background: "linear-gradient(180deg, #FAFBFC 0%, #F0F2F5 100%)" }}>

          {/* Header */}
          <header style={{ background: "#fff", borderBottom: "1px solid #E9ECEF", padding: "0 24px", position: "sticky", top: 0, zIndex: 100 }}>

                  <div>
                    <h1 style={{ fontSize: 18, fontWeight: 900, color: "#1A1A2E", margin: 0, letterSpacing: -0.5 }}>探究教室 TRAIL</h1>

                <div style={{ display: "flex", background: "#F1F3F5", borderRadius: 10, padding: 3 }}>

                    <button key={v.key} onClick={() => setViewMode(v.key)}
                      style={{ padding: "7px 16px", borderRadius: 8, border: "none", background: viewMode === v.key ? "#fff" : "transparent", boxShadow: viewMode === v.key ? "0 1px 4px rgba(0,0,0,0.08)" : "none", color: viewMode === v.key ? "#1A1A2E" : "#868E96", fontWeight: 600, fontSize: 13, cursor: "pointer", transition: "all 0.15s", fontFamily: "'Zen Kaku Gothic New', sans-serif" }}>
                      {v.label}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </header>

          {/* Course Tabs */}
          <div style={{ background: "#fff", borderBottom: "1px solid #E9ECEF", overflowX: "auto", WebkitOverflowScrolling: "touch" }}>
            <div style={{ maxWidth: 960, margin: "0 auto", padding: "0 24px", display: "flex", gap: 4 }}>
              {COURSES.map((c) => (
                <button key={c.id} onClick={() => setActiveCourse(c.id)}
                  style={{ padding: "14px 18px", border: "none", background: "transparent", borderBottom: activeCourse === c.id ? `3px solid ${c.color}` : "3px solid transparent", color: activeCourse === c.id ? c.color : "#868E96", fontWeight: activeCourse === c.id ? 800 : 500, fontSize: 13.5, cursor: "pointer", whiteSpace: "nowrap", transition: "all 0.2s", fontFamily: "'Zen Kaku Gothic New', sans-serif" }}>
                  <span style={{ marginRight: 6 }}>{c.icon}</span>{c.name}
                  <span style={{ display: "block", fontSize: 10, fontWeight: 500, color: activeCourse === c.id ? `${c.color}99` : "#ADB5BD", marginTop: 2 }}>
                    {c.target}<span style={{ marginLeft: 4 }}>/ {c.day}</span>
                  </span>
                </button>
              ))}
            </div>
          </div>

          {/* Course Header */}
          <div style={{ maxWidth: 960, margin: "0 auto", padding: "28px 24px 0", animation: mounted ? "slideIn 0.3s ease" : "none" }}>
            <div style={{ background: `linear-gradient(135deg, ${course.color}10, ${course.accent})`, borderRadius: 16, padding: "20px 28px", border: `1px solid ${course.color}15`, display: "flex", alignItems: "center", gap: 16 }}>
              <div style={{ width: 52, height: 52, borderRadius: 14, background: `linear-gradient(135deg, ${course.color}, ${course.color}BB)`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26, flexShrink: 0 }}>{course.icon}</div>
              <div>
                <h2 style={{ fontSize: 20, fontWeight: 800, color: "#1A1A2E", margin: "0 0 4px" }}>
                  {course.name}
                  <span style={{ fontSize: 13, fontWeight: 500, color: "#868E96", marginLeft: 10 }}>{course.target}　📅 毎週{course.day}</span>
                </h2>
                <p style={{ fontSize: 13.5, color: "#5C5C6F", margin: 0 }}>{course.description}</p>
              </div>
            </div>
          </div>

          {/* Content */}
          <div style={{ maxWidth: 960, margin: "0 auto", padding: "24px 24px 60px" }}>
            {viewMode === "list" ? (
              <div style={{ display: "grid", gap: 12, animation: "slideIn 0.3s ease" }}>
                {monthKeys.length === 0 ? (
                  <div style={{ textAlign: "center", padding: 60, color: "#ADB5BD" }}>まだ授業が登録されていません</div>
                ) : (
                  monthKeys.map((monthKey) => {
                    const monthLessons = lessonsByMonth[monthKey];
                    const isOpen = !!openMonths[monthKey];
                    const [y, m] = monthKey.split("-");
                    const monthLabel = `${y}年 ${parseInt(m)}月`;
                    return (
                      <div key={monthKey} style={{ animation: "slideIn 0.3s ease" }}>
                        <button onClick={() => toggleMonth(monthKey)}
                          style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 20px", background: isOpen ? `linear-gradient(135deg, ${course.color}08, ${course.accent}80)` : "#fff", border: `1px solid ${isOpen ? course.color + "30" : "#E9ECEF"}`, borderRadius: isOpen ? "14px 14px 0 0" : 14, cursor: "pointer", transition: "all 0.2s", fontFamily: "'Zen Kaku Gothic New', sans-serif" }}
                          onMouseEnter={(e) => { if (!isOpen) e.currentTarget.style.background = "#F8F9FA"; }}
                          onMouseLeave={(e) => { if (!isOpen) e.currentTarget.style.background = "#fff"; }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                            <span style={{ fontSize: 18, fontWeight: 800, color: isOpen ? course.color : "#1A1A2E" }}>{monthLabel}</span>
                            <span style={{ fontSize: 12, fontWeight: 700, padding: "3px 10px", borderRadius: 99, background: isOpen ? course.color : "#E9ECEF", color: isOpen ? "#fff" : "#868E96", transition: "all 0.2s" }}>{monthLessons.length}回</span>
                          </div>
                          <span style={{ fontSize: 16, color: isOpen ? course.color : "#ADB5BD", transform: isOpen ? "rotate(180deg)" : "rotate(0deg)", transition: "transform 0.25s ease", display: "inline-block" }}>▼</span>
                        </button>
                        {isOpen && (
                          <div style={{ border: `1px solid ${course.color}20`, borderTop: "none", borderRadius: "0 0 14px 14px", background: "#fff", padding: "12px 14px", display: "grid", gap: 10, animation: "slideIn 0.2s ease" }}>
                            {monthLessons.map((lesson, i) => (
                              <div key={lesson.id} style={{ animation: `slideIn 0.2s ease ${i * 0.04}s both` }}>
                                <LessonCard lesson={lesson} course={course} onClick={() => setSelectedLesson(lesson)} />
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })
                )}
              </div>
            ) : (
              <div style={{ background: "#fff", borderRadius: 16, padding: 24, border: "1px solid #E9ECEF", animation: "slideIn 0.3s ease" }}>
                <Calendar year={calYear} month={calMonth} lessons={lessons} course={course} onLessonClick={setSelectedLesson} onMonthChange={handleMonthChange} />
                <div style={{ marginTop: 20, paddingTop: 16, borderTop: "1px solid #F1F3F5", display: "flex", flexWrap: "wrap", gap: 12 }}>
                  {lessons.filter((l) => l.date.startsWith(formatDate(calYear, calMonth, 1).slice(0, 7))).map((l) => (
                    <button key={l.id} onClick={() => setSelectedLesson(l)}
                      style={{ display: "flex", alignItems: "center", gap: 8, background: course.accent, border: "none", borderRadius: 10, padding: "8px 14px", cursor: "pointer", transition: "transform 0.15s", fontFamily: "'Zen Kaku Gothic New', sans-serif" }}
                      onMouseEnter={(e) => (e.currentTarget.style.transform = "scale(1.03)")}
                      onMouseLeave={(e) => (e.currentTarget.style.transform = "scale(1)")}>
                      <div style={{ width: 8, height: 8, borderRadius: "50%", background: course.color }} />
                      <span style={{ fontSize: 12, fontWeight: 600, color: "#495057" }}>{l.date.split("-")[2]}日 - {l.title}</span>
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>

          {selectedLesson && <LessonModal lesson={selectedLesson} course={course} onClose={() => setSelectedLesson(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
